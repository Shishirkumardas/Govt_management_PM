# PostgreSQL production profile
# Run: SPRING_PROFILES_ACTIVE=prod  (or --spring.profiles.active=prod)
# Env: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/govos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:govos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:govos_secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# Hardened defaults
server.error.include-stacktrace=never
server.error.include-message=on_param

# Require strong secret in prod (set GOVOS_JWT_SECRET)
govos.jwt.secret=${GOVOS_JWT_SECRET}
govos.jwt.expiration-ms=${GOVOS_JWT_EXPIRATION_MS:28800000}

govos.cors.allowed-origins=${GOVOS_CORS_ORIGINS:https://govos.gov.bd}

logging.level.bd.gov.govos=INFO
logging.level.org.springframework.security=WARN

management.endpoint.health.show-details=never
