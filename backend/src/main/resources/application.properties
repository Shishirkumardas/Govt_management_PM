spring.application.name=GovOS-Bangladesh

# Default: H2 for local demo. Activate profile "prod" for PostgreSQL.
spring.profiles.default=dev

spring.datasource.url=jdbc:h2:mem:govos;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# JWT — override via env GOVOS_JWT_SECRET in production
govos.jwt.secret=${GOVOS_JWT_SECRET:GovOS-Bangladesh-PM-Secret-Key-Change-In-Production-2026-Must-Be-256-Bits-Min!!}
govos.jwt.expiration-ms=${GOVOS_JWT_EXPIRATION_MS:86400000}

# AI (SpaceXAI / xAI — set XAI_API_KEY in environment)
govos.ai.base-url=https://api.x.ai/v1
govos.ai.model=grok-4.5
govos.ai.enabled=true

# CORS
govos.cors.allowed-origins=${GOVOS_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# MFA
govos.mfa.required-for-privileged=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

logging.level.bd.gov.govos=INFO
